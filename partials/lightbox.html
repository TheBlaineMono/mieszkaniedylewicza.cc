<div id="lightboxOverlay" style="position:fixed;inset:0;z-index:9999;background:rgba(8,12,24,.88);display:none;align-items:center;justify-content:center;padding:24px;">
  <button id="lightboxClose" aria-label="Zamknij" style="position:absolute;top:18px;right:18px;width:44px;height:44px;border:0;border-radius:999px;background:#fff;color:#111;font-size:26px;cursor:pointer;line-height:44px;z-index:1;">×</button>
  <img id="lightboxImage" alt="" style="max-width:min(95vw,1400px);max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.35);">
  <button id="lightboxPrev" aria-label="Poprzednie zdjęcie" style="position:absolute;left:24px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:14px;background:linear-gradient(135deg, #d97757 0%, #e58f6b 100%);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.24);">‹</button>
  <button id="lightboxNext" aria-label="Następne zdjęcie" style="position:absolute;right:24px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:14px;background:linear-gradient(135deg, #d97757 0%, #e58f6b 100%);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.24);">›</button>
</div>
