<script>
(function(){

function draw(hi){
  const box=st.getBoundingClientRect(),W=hi?Math.min(1300,Math.max(600,Math.round(box.width*Math.min(devicePixelRatio||1,1.5)))):Math.round(Math.min(560,box.width));
  const c=cam(W),d=R3D.render(sc,c,{ss:hi?2:1,ao:hi,bands:hi?4:1,shadow:sm,mural});
  cv.width=c.W;cv.height=c.H;cv.getContext('2d').putImageData(new ImageData(d,c.W,c.H),0,0);
